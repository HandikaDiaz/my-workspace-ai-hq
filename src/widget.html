<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Commander Diaz Mini Widget</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', Inter, sans-serif;
    }
    #widget-container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 8px;
      -webkit-app-region: drag; /* Memungkinkan widget di-drag ke mana saja di desktop */
      cursor: grab;
    }
    #widget-container:active {
      cursor: grabbing;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }
    /* Balon Status Melayang di atas astronot */
    #status-bubble {
      position: relative;
      z-index: 10;
      background: rgba(9, 13, 28, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.45);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 5px 9px;
      max-width: 180px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      margin-bottom: 125px;
      transition: all 0.25s ease;
      -webkit-app-region: no-drag;
      cursor: pointer;
    }
    #status-bubble:hover {
      border-color: #38bdf8;
      transform: translateY(-2px);
    }
    #status-badge {
      font-size: 9px;
      font-family: Consolas, monospace;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    #status-badge.working {
      color: #34d399;
    }
    #status-text {
      font-size: 10px;
      color: #f1f5f9;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    /* Action Bar Bawah: Hint Klik */
    #hint-pill {
      position: absolute;
      bottom: 4px;
      z-index: 10;
      font-size: 8.5px;
      font-family: Consolas, monospace;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94a3b8;
      padding: 2px 7px;
      border-radius: 999px;
      -webkit-app-region: no-drag;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    #hint-pill:hover {
      background: #38bdf8;
      color: #090d16;
      border-color: #38bdf8;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="widget-container" title="Double click atau klik tombol untuk buka kembali 3D Office">
    <div id="canvas-container"></div>

    <div id="status-bubble" id="btn-bubble-restore">
      <div id="status-badge">
        <span id="badge-dot">●</span>
        <span id="badge-title">STANDBY</span>
      </div>
      <div id="status-text">Commander Diaz Ready</div>
    </div>

    <div id="hint-pill">⚡ Double-click to Open HQ</div>
  </div>

  <script type="module" src="./widget.js"></script>
</body>
</html>
